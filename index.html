<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- ИСПРАВЛЕНО: теперь тег корректно закрыт -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дружинина Виктория | Ландшафтный архитектор</title>
  
  <style>
    /* Сброс и базовые настройки */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      background-color: #0f172a; /* Тёмный цвет фона на случай, если фото не загрузится */
    }

    /* --- Меню сверху --- */
    .hero-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 40px;
      z-index: 100;
    }

    .hero-nav ul {
      list-style: none;
      display: flex;
      gap: 32px;
    }

    .hero-nav a {
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-nav a:hover {
      color: #d1d5db;
    }

    /* --- Секция-обёртка (фото + текст) --- */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh; /* На весь экран по высоте */
      display: flex;
      align-items: center;
      justify-content: center;
      
      /* ВАЖНО: Укажи здесь имя своего файла с фото */
      background-image: url('bg.jpg'); 
      
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow: hidden;
    }

    /* Тёмная полупрозрачная плашка слева */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Цвет #0f172a с прозрачностью 0.85 */
      background: rgba(15, 23, 42, 0.85); 
      z-index: 1;
    }

    /* --- Контент (текст и кнопка) --- */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 560px;
      padding-right: 40px;
      padding-left: 40px;
    }

    .hero-name {
      font-size: 64px;
      line-height: 1.1;
      font-weight: 300;
      letter-spacing: -2px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .hero-profession {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9ca3af;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .hero-tagline {
      font-size: 16px;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 36px;
    }

    /* Кнопка */
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .hero-btn:hover {
      background: #ffffff;
      color: #0f172a;
    }

    .hero-btn span {
      font-size: 16px;
      transition: transform 0.3s ease;
    }

    .hero-btn:hover span {
      transform: translateX(4px);
    }

    /* Цитата справа (как на фото) */
    .hero-quote {
      position: absolute;
      bottom: 40px;
      right: 60px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 16px 24px;
      border-radius: 12px;
      max-width: 320px;
      z-index: 2;
    }

    .hero-quote p {
      font-size: 14px;
      line-height: 1.5;
      color: #ffffff;
    }

    /* --- Адаптив (чтобы на телефоне не разъехалось) --- */
    @media (max-width: 768px) {
      .hero-header {
        padding: 16px;
      }
      
      .hero-nav ul {
        gap: 16px;
      }

      .hero-content {
        padding-left: 20px;
        padding-right: 20px;
      }

      .hero-name {
        font-size: 42px;
      }

      .hero-quote {
        bottom: 20px;
        right: 20px;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Меню -->
  <header class="hero-header">
    <nav class="hero-nav">
      <ul class="hero-menu">
        <li><a href="#about">Обо мне</a></li>
        <li><a href="#portfolio">Портфолио</a></li>
        <li><a href="#contacts">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <!-- Первая секция (Главный экран) -->
  <section class="hero-section">
    <div class="hero-overlay"></div> <!-- Тёмная подложка поверх фото -->
    
    <div class="hero-content">
      <h1 class="hero-name">Дружинина Виктория</h1>
      <p class="hero-profession">ландшафтный архитектор & художник</p>
      <p class="hero-tagline">Создаю пространства и образы, в которые хочется возвращаться</p>
      
      <a href="#contacts" class="hero-btn">Связаться со мной <span>+</span></a>
    </div>

    <div class="hero-quote">
      <p>Творчество. Гармония. Смысл в каждой детали</p>
    </div>
  </section>

  <!-- Сюда можно добавлять следующие секции: Обо мне, Портфолио и т.д. -->
  <section id="about" style="padding: 100px 40px; text-align: center;">
    <h2>Обо мне</h2>
    <p style="margin-top: 20px; color: #9ca3af;">Здесь будет текст о тебе...</p>
  </section>

</body>
</html>
